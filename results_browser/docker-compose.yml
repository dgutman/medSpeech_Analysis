services:
  # Main application service with integrated data preparation
  results-browser:
    build:
      context: ..
      dockerfile: results_browser/Dockerfile
      args:
        PIXELTABLE_API_KEY: ${PIXELTABLE_API_KEY}
        PIXELTABLE_DATASET_URL: ${PIXELTABLE_DATASET_URL:-pxt://speech-to-text-analytics:main/hani89_asr_data_reload/transcribe_compare}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8060:8050"
    volumes:
      - ./:/app # Bind mount for editing code
      - ../.env:/app/.env:ro
      # Cache and data directories are internal to container (created in Dockerfile)
    environment:
      - PYTHONPATH=/app
      - CACHE_DIR=/var/lib/app/cache
      - DATA_DIR=/var/lib/app/data
      # Override PIXELTABLE_PGDATA to use container path (data is preloaded during build)
      # Host path from .env doesn't exist in container, so use container's default location
      # Pixeltable default is ~/.pixeltable/pgdata (for appuser: /home/appuser/.pixeltable/pgdata)
      - PIXELTABLE_PGDATA=/home/appuser/.pixeltable/pgdata
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8050/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development service with bind mounts
  results-browser-dev:
    build:
      context: ..
      dockerfile: results_browser/Dockerfile
      args:
        PIXELTABLE_API_KEY: ${PIXELTABLE_API_KEY}
        PIXELTABLE_DATASET_URL: ${PIXELTABLE_DATASET_URL:-pxt://speech-to-text-analytics:main/hani89_asr_data_reload/transcribe_compare}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8060:8050"
    volumes:
      # Mount the entire directory for code editing, but overlay venv with a named volume
      # This prevents the host's venv from interfering with container's Python packages
      - ./:/app
      - ../.env:/app/.env:ro
    environment:
      - PYTHONPATH=/app
      - CACHE_DIR=/app/cache
      - DATA_DIR=/app/data
      # Override PIXELTABLE_PGDATA to use container path (data is preloaded during build)
      # Host path from .env doesn't exist in container, so use container's default location
      # Pixeltable default is ~/.pixeltable/pgdata (for appuser: /home/appuser/.pixeltable/pgdata)
      - PIXELTABLE_PGDATA=/home/appuser/.pixeltable/pgdata
      # Use Gunicorn unless .env has USE_GUNICORN=0 for real dev (Dash dev server). Default 1 for Pixeltable stability.
      - USE_GUNICORN=${USE_GUNICORN:-1}
      # Use simplified app (set to 0 for full app with all tabs); startup.sh falls back to full app if app_simple.py missing
      - USE_SIMPLE_APP=1
    env_file:
      - ../.env
    command: [ "./startup.sh" ]
    profiles: [ "dev" ] # Only run when explicitly requested
